<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>交通監控 v1.3.1</title>

<style>

html,body{
    margin:0;
    padding:0;
    background:#0b0f14;
    font-family:Arial;
    overflow:hidden;
}

/* ===== GRID ===== */

.grid{
    display:grid;
    width:100vw;
    height:100vh;
    gap:4px;
    padding:4px;
    box-sizing:border-box;

    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(2,1fr);

    overflow:hidden;
}

/* ===== CAMERA ===== */

.camera{
    position:relative;
    overflow:hidden;
    background:black;

    border:3px solid #222;

    cursor:pointer;

    min-width:0;
    min-height:0;
}

.camera.ok{ border-color:#00ff7f; }
.camera.warn{ border-color:#ffcc00; }
.camera.err{ border-color:#ff3b30; }

/* iframe */
iframe{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border:0;
    pointer-events:none;
}

/* title */
.title{
    position:absolute;
    top:6px;
    left:6px;
    z-index:10;

    background:rgba(0,0,0,.7);
    color:#fff;

    padding:4px 8px;
    font-size:12px;
}

/* status */
.status{
    position:absolute;
    top:6px;
    right:6px;
    z-index:10;

    background:rgba(0,0,0,.7);
    padding:4px 8px;
    font-size:12px;
}

.status.ok{ color:#00ff7f; }
.status.warn{ color:#ffcc00; }
.status.err{ color:#ff3b30; }

/* ===== FOCUS MODE ===== */

.focusOverlay{
    position:fixed;
    inset:0;
    background:black;
    z-index:9999;

    display:none;

    overflow:auto;   /* 🔥 允許滾動 */
}

.focusOverlay.active{
    display:block;
}

/* 放大後不是 clone，而是移動原本 */
.focused{
    width:100%;
    height:100%;
}

/* ===== MOBILE ===== */

@media(max-width:768px){

    html,body{
        overflow:auto;   /* 🔥 手機允許滑動 */
        height:auto;
    }

    .grid{
        display:flex;
        flex-direction:column;
        height:auto;
    }

    .camera{
        height:220px;
        min-height:220px;
    }
}

</style>
</head>

<body>

<div class="grid">

    <div class="camera ok" onclick="focusCam(this)">
        <div class="title">CAM-01</div>
        <div class="status ok">🟢</div>
        <iframe src="https://trafficvideo.tainan.gov.tw/1914bcd5"></iframe>
    </div>

    <div class="camera warn" onclick="focusCam(this)">
        <div class="title">CAM-02</div>
        <div class="status warn">🟡</div>
        <iframe src="https://trafficvideo.tainan.gov.tw/3e6342c7"></iframe>
    </div>

    <div class="camera ok" onclick="focusCam(this)">
        <div class="title">CAM-03</div>
        <div class="status ok">🟢</div>
        <iframe src="https://trafficvideo2.tainan.gov.tw/26f189b2"></iframe>
    </div>

    <div class="camera err" onclick="focusCam(this)">
        <div class="title">CAM-04</div>
        <div class="status err">🔴</div>
        <iframe src="https://trafficvideo2.tainan.gov.tw/6d3a22cf"></iframe>
    </div>

    <div class="camera ok" onclick="focusCam(this)">
        <div class="title">CAM-05</div>
        <div class="status ok">🟢</div>
        <iframe src="https://trafficvideo2.tainan.gov.tw/b15b446c"></iframe>
    </div>

    <div class="camera warn" onclick="focusCam(this)">
        <div class="title">CAM-06</div>
        <div class="status warn">🟡</div>
        <iframe src="https://trafficvideo.tainan.gov.tw/48e70b5d"></iframe>
    </div>

</div>

<div class="focusOverlay" id="overlay"></div>

<script>

let currentCam = null;

/* ===== FOCUS（改成移動 DOM，不 clone） ===== */

function focusCam(el){

    const overlay = document.getElementById("overlay");

    if(currentCam){
        returnCam();
    }

    currentCam = el;

    overlay.innerHTML = "";
    overlay.appendChild(el);

    el.classList.add("focused");

    overlay.classList.add("active");
}

/* ===== RETURN ===== */

function returnCam(){

    const overlay = document.getElementById("overlay");

    const grid = document.querySelector(".grid");

    if(currentCam){

        currentCam.classList.remove("focused");

        grid.appendChild(currentCam);

        currentCam = null;
    }

    overlay.classList.remove("active");
}

/* 點背景關閉 */
document.getElementById("overlay")
.addEventListener("click", returnCam);

/* ===== KEYBOARD ===== */

document.addEventListener("keydown",(e)=>{

    const cams = document.querySelectorAll(".camera");

    const num = parseInt(e.key);

    if(num >= 1 && num <= cams.length){
        focusCam(cams[num - 1]);
    }

    if(e.key === "Escape"){
        returnCam();
    }
});

</script>

</body>
</html>
