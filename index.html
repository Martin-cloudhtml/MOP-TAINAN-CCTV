<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>監控牆 v6.5（壅塞標記版）</title>

<style>

html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#0b0f14;
}

/* ===== wrapper ===== */
.wrapper{
    width:100vw;
    height:100vh;
}

/* ===== GRID ===== */
.grid{
    display:grid;
    width:100%;
    height:100vh;

    gap:4px;

    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(2, 1fr);
}

/* ===== CAMERA ===== */
.camera{
    position:relative;
    overflow:hidden;
    background:#000;
    cursor:pointer;

    border:3px solid #1f2a33;
    transition:0.3s;
}

/* 壅塞顏色 */
.camera.ok{ border-color:#00ff7f; }
.camera.warn{ border-color:#ffcc00; }
.camera.err{ border-color:#ff3b30; }

iframe{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border:0;
}

/* title */
.title{
    position:absolute;
    top:6px;
    left:6px;
    z-index:10;

    background:rgba(0,0,0,0.7);
    color:#00ff7f;

    padding:4px 8px;
    font-size:12px;
}

/* ===== FOCUS ===== */
.focusOverlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.92);

    display:none;
    z-index:9999;
}

.focusOverlay.active{
    display:block;
}

.focusCam{
    width:100%;
    height:100%;
}

</style>
</head>

<body>

<div class="wrapper">

    <div class="grid">

        <div class="camera ok" onclick="focusCam(this)">
            <div class="title">CAM-01</div>
            <iframe src="https://trafficvideo.tainan.gov.tw/1914bcd5"></iframe>
        </div>

        <div class="camera warn" onclick="focusCam(this)">
            <div class="title">CAM-02</div>
            <iframe src="https://trafficvideo.tainan.gov.tw/3e6342c7"></iframe>
        </div>

        <div class="camera ok" onclick="focusCam(this)">
            <div class="title">CAM-03</div>
            <iframe src="https://trafficvideo2.tainan.gov.tw/26f189b2"></iframe>
        </div>

        <div class="camera err" onclick="focusCam(this)">
            <div class="title">CAM-04</div>
            <iframe src="https://trafficvideo2.tainan.gov.tw/6d3a22cf"></iframe>
        </div>

        <div class="camera ok" onclick="focusCam(this)">
            <div class="title">CAM-05</div>
            <iframe src="https://trafficvideo2.tainan.gov.tw/b15b446c"></iframe>
        </div>

        <div class="camera warn" onclick="focusCam(this)">
            <div class="title">CAM-06</div>
            <iframe src="https://trafficvideo.tainan.gov.tw/48e70b5d"></iframe>
        </div>

    </div>

</div>

<!-- focus -->
<div class="focusOverlay" id="overlay" onclick="closeFocus()"></div>

<script>

function focusCam(el){

    const overlay = document.getElementById("overlay");

    const clone = el.cloneNode(true);
    clone.classList.add("focusCam");
    clone.onclick = closeFocus;

    overlay.innerHTML = "";
    overlay.appendChild(clone);

    overlay.classList.add("active");
}

function closeFocus(){
    const overlay = document.getElementById("overlay");
    overlay.classList.remove("active");
    overlay.innerHTML = "";
}

/* ===== keyboard ===== */
document.addEventListener("keydown", function(e){

    const key = parseInt(e.key);
    const cams = document.querySelectorAll(".camera");

    if(key >= 1 && key <= 9){
        const target = cams[key - 1];
        if(target) focusCam(target);
    }

    if(e.key === "Escape"){
        closeFocus();
    }
});

/* ===== fake AI 壅塞偵測 ===== */
function updateTrafficStatus(){

    const cams = document.querySelectorAll(".camera");

    cams.forEach(cam => {

        const r = Math.random();

        cam.classList.remove("ok","warn","err");

        if(r < 0.6){
            cam.classList.add("ok");      // 順暢
        }else if(r < 0.85){
            cam.classList.add("warn");    // 注意
        }else{
            cam.classList.add("err");     // 壅塞
        }
    });

}

/* 每 5 秒更新一次 */
setInterval(updateTrafficStatus, 5000);
updateTrafficStatus();

</script>

</body>
</html>
