<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>MOP台南週邊道路監控版 v1.3</title>

<style>

/* =========================
   BASE
========================= */

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#0b0f14;
    font-family:Arial,sans-serif;
}

/* =========================
   DESKTOP GRID (戰情室)
========================= */

.grid{
    display:grid;

    width:100vw;
    height:100vh;

    gap:4px;
    padding:4px;
    box-sizing:border-box;

    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(2,1fr);
}

/* =========================
   CAMERA TILE
========================= */

.camera{
    position:relative;
    overflow:hidden;
    background:black;

    border:3px solid #222;

    cursor:pointer;
    transition:.2s;

    min-width:0;
    min-height:0;
}

/* traffic status colors */
.camera.ok{ border-color:#00ff7f; }
.camera.warn{ border-color:#ffcc00; }
.camera.err{ border-color:#ff3b30; }

/* iframe */
iframe{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    border:0;

    /* allow click-through to tile */
    pointer-events:none;
}

/* title */
.title{
    position:absolute;
    top:8px;
    left:8px;

    z-index:10;

    background:rgba(0,0,0,.7);
    color:#fff;

    padding:4px 8px;
    border-radius:4px;

    font-size:13px;
}

/* status */
.status{
    position:absolute;
    top:8px;
    right:8px;

    z-index:10;

    background:rgba(0,0,0,.7);
    padding:4px 8px;

    border-radius:4px;

    font-size:12px;
}

.status.ok{ color:#00ff7f; }
.status.warn{ color:#ffcc00; }
.status.err{ color:#ff3b30; }

/* =========================
   FOCUS MODE
========================= */

.focusOverlay{
    position:fixed;
    inset:0;

    background:black;

    display:none;
    z-index:9999;
}

.focusOverlay.active{
    display:block;
}

.focusCam{
    width:100vw;
    height:100vh;
}

/* =========================
   MOBILE MODE
========================= */

@media(max-width:768px){

    html,body{
        overflow-y:auto;
        height:auto;
    }

    .grid{
        display:flex;
        flex-direction:column;

        width:100%;
        height:auto;
    }

    .camera{
        height:220px;
        min-height:220px;

        aspect-ratio:auto;
    }
}

</style>
</head>

<body>

<div class="grid">

    <div class="camera ok" onclick="focusCam(this)">
        <div class="title">CAM-01 北平面</div>
        <div class="status ok">🟢 順暢</div>
        <iframe src="https://trafficvideo.tainan.gov.tw/1914bcd5"></iframe>
    </div>

    <div class="camera warn" onclick="focusCam(this)">
        <div class="title">CAM-02 南側車塔入口</div>
        <div class="status warn">🟡 車多</div>
        <iframe src="https://trafficvideo.tainan.gov.tw/3e6342c7"></iframe>
    </div>

    <div class="camera ok" onclick="focusCam(this)">
        <div class="title">CAM-03 高鐵歸仁大道側</div>
        <div class="status ok">🟢 順暢</div>
        <iframe src="https://trafficvideo2.tainan.gov.tw/26f189b2"></iframe>
    </div>

    <div class="camera err" onclick="focusCam(this)">
        <div class="title">CAM-04 86東向下高鐵</div>
        <div class="status err">🔴 壅塞</div>
        <iframe src="https://trafficvideo2.tainan.gov.tw/6d3a22cf"></iframe>
    </div>

    <div class="camera ok" onclick="focusCam(this)">
        <div class="title">CAM-05</div>
        <div class="status ok">🟢 順暢</div>
        <iframe src="https://trafficvideo2.tainan.gov.tw/b15b446c"></iframe>
    </div>

    <div class="camera warn" onclick="focusCam(this)">
        <div class="title">CAM-06</div>
        <div class="status warn">🟡 車多</div>
        <iframe src="https://trafficvideo.tainan.gov.tw/48e70b5d"></iframe>
    </div>

</div>

<!-- focus overlay -->
<div class="focusOverlay" id="overlay"></div>

<script>

/* =========================
   FOCUS
========================= */

function focusCam(el){

    const overlay = document.getElementById("overlay");

    const clone = el.cloneNode(true);
    clone.classList.add("focusCam");

    overlay.innerHTML = "";
    overlay.appendChild(clone);

    overlay.classList.add("active");
}

function closeFocus(){

    const overlay = document.getElementById("overlay");

    overlay.classList.remove("active");
    overlay.innerHTML = "";
}

/* click overlay to close */
document.getElementById("overlay")
.addEventListener("click", closeFocus);

/* =========================
   KEYBOARD CONTROL
========================= */

document.addEventListener("keydown",(e)=>{

    const cams = document.querySelectorAll(".camera");

    const num = parseInt(e.key);

    if(num >= 1 && num <= cams.length){
        focusCam(cams[num - 1]);
    }

    if(e.key === "Escape"){
        closeFocus();
    }
});

/* =========================
   FAKE TRAFFIC AI
========================= */

function updateTraffic(){

    const cams = document.querySelectorAll(".camera");

    cams.forEach(cam=>{

        const status = cam.querySelector(".status");

        const r = Math.random();

        cam.classList.remove("ok","warn","err");
        status.classList.remove("ok","warn","err");

        if(r < 0.6){

            cam.classList.add("ok");
            status.classList.add("ok");
            status.innerHTML="🟢 順暢";

        }else if(r < 0.85){

            cam.classList.add("warn");
            status.classList.add("warn");
            status.innerHTML="🟡 車多";

        }else{

            cam.classList.add("err");
            status.classList.add("err");
            status.innerHTML="🔴 壅塞";
        }
    });
}

setInterval(updateTraffic,5000);
updateTraffic();

</script>

</body>
</html>
